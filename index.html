<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000"><link rel="manifest" href="manifest.json"><title>Feeds & Speeds</title>
<style>
body{margin:0;background:#000;color:#fff;font:20px/1.3 system-ui,sans-serif}main{padding:12px;max-width:600px;margin:auto}
h1{font-size:24px;color:#ffd400;margin:4px 0 10px}label{display:block;margin-top:10px;font-weight:700}
select,input{width:100%;box-sizing:border-box;min-height:56px;font-size:22px;background:#111;color:#fff;border:3px solid #fff;border-radius:8px;padding:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.out{margin-top:14px;border:3px solid #ffd400;border-radius:8px;padding:10px}.big{font-size:40px;font-weight:800;color:#ffd400}
.src{font-size:15px;color:#ccc;margin-top:8px}.warn{color:#ff6b6b;font-weight:700}.tag{border:2px solid;padding:0 6px;border-radius:6px;font-size:14px}
</style></head><body><main><h1>Feeds &amp; Speeds v0</h1>
<label>Tool<select id="tool"></select></label>
<label>Material<select id="mat"></select></label>
<div class="row"><label>Dia (in)<input id="d" type="number" inputmode="decimal" step="any" value="0.5"></label>
<label>Flutes<input id="z" type="number" inputmode="numeric" value="4"></label></div>
<div class="row"><label>SFM<input id="sfm" type="number" inputmode="decimal"></label>
<label>Chip load (in/t)<input id="fpt" type="number" inputmode="decimal" step="any"></label></div>
<div class="row"><label>WOC ae (in)<input id="ae" type="number" inputmode="decimal" step="any" value="0.25"></label>
<label>DOC ap (in)<input id="ap" type="number" inputmode="decimal" step="any" value="0.5"></label></div>
<div class="row"><label>Stickout (in)<input id="so" type="number" inputmode="decimal" step="any" value="1.5"></label>
<label>Max RPM<input id="maxRpm" type="number" inputmode="numeric" value="10000"></label></div>
<label>Machine HP<input id="maxHp" type="number" inputmode="decimal" value="15"></label>
<div class="out" id="out"></div><div class="src" id="src"></div></main>
<script type="module" src="app.js"></script></body></html>
