<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000"><link rel="manifest" href="manifest.json"><title>Feeds & Speeds</title>
<style>
body{margin:0;background:#000;color:#fff;font:20px/1.3 system-ui,sans-serif}main{padding:12px;max-width:600px;margin:auto}
h1{font-size:24px;color:#ffd400;margin:4px 0 10px}label{display:block;margin-top:10px;font-weight:700}
select,input{width:100%;box-sizing:border-box;min-height:56px;font-size:22px;background:#111;color:#fff;border:3px solid #fff;border-radius:8px;padding:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.out{margin-top:14px;border:3px solid #ffd400;border-radius:8px;padding:10px}.big{font-size:40px;font-weight:800;color:#ffd400}
.src{font-size:15px;color:#ccc;margin-top:8px}.warn{color:#ff6b6b;font-weight:700}.tag{border:2px solid;padding:0 6px;border-radius:6px;font-size:14px}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}nav button{min-height:56px;font-size:20px;font-weight:800;background:#111;color:#fff;border:3px solid #fff;border-radius:8px}button.sm{min-height:48px;font-size:18px;font-weight:700;background:#111;color:#fff;border:3px solid #fff;border-radius:8px;padding:0 10px}summary{cursor:pointer;font-weight:800;font-size:18px;color:#7f7}.shop{color:#ffa500!important}nav button.on{background:#ffd400;color:#000;border-color:#ffd400}[hidden]{display:none!important}
</style></head><body><main><h1>Feeds &amp; Speeds v3</h1>
<nav><button data-mode="mill">Mill</button><button data-mode="drill">Drill</button><button data-mode="turn">Turn</button><button data-mode="tap">Tap</button></nav>
<label>Recall (favorites / recent)<select id="recall"><option value="">—</option></select></label>
<label>Material / condition<select id="iso"></select></label>
<label>Brand<select id="brand"></select></label>
<label>Tool / insert<select id="tool"></select></label>
<label><input id="onlyData" type="checkbox" checked style="width:auto;min-height:0"> Only tools with data for this material</label>
<label>Manufacturer condition<select id="cond"></select></label>
<label data-show="tap">Thread<select id="thr"></select></label>
<label>Machine profile<select id="mach"><option value="">(none, enter limits)</option></select></label>
<details><summary>Add / remove machine profile</summary><div class="row"><label>Name<input id="mName"></label><label>Type<select id="mType"><option value="mill">Mill</option><option value="lathe">Lathe</option></select></label></div><div class="row"><label>Max RPM<input id="mRpm" type="number" inputmode="numeric"></label><label>HP<input id="mHp" type="number" inputmode="decimal"></label></div><button class="sm" id="mSave">Save profile</button> <button class="sm" id="mDel">Delete selected</button></details>
<label>Coolant<select id="cool"><option value="flood">Flood</option><option value="air">Air blast</option><option value="dry">Dry</option></select></label>
<div class="row"><label id="dLbl">Dia (in)<input id="d" type="number" inputmode="decimal" step="any" value="0.5"></label>
<label data-show="mill">Flutes<input id="z" type="number" inputmode="numeric" value="4"></label></div>
<div class="row"><label>SFM<input id="sfm" type="number" inputmode="decimal"></label>
<label id="feedLbl">Chip load (in/t)<input id="fpt" type="number" inputmode="decimal" step="any"></label></div>
<div class="row" data-show="mill"><label>WOC ae (in)<input id="ae" type="number" inputmode="decimal" step="any" value="0.25"></label>
<label>DOC ap (in)<input id="ap" type="number" inputmode="decimal" step="any" value="0.5"></label></div>
<div class="row"><label data-show="mill">Stickout (in)<input id="so" type="number" inputmode="decimal" step="any" value="1.5"></label><label data-show="turn">DOC ap (in)<input id="apT" type="number" inputmode="decimal" step="any" value="0.04"></label>
<label>Max RPM<input id="maxRpm" type="number" inputmode="numeric" placeholder="machine max"></label></div>
<div class="row" data-show="turn"><label>Nose radius (in)<input id="nose" type="number" inputmode="decimal" step="any"></label><label>Chipbreaker<input id="cb" placeholder="e.g. NF, F3M"></label></div>
<div class="row" data-show="turn"><label>Length out of chuck (in)<input id="len" type="number" inputmode="decimal" step="any"></label><label>Support<select id="sup"><option value="none">None</option><option value="tail">Tailstock</option><option value="steady">Steady rest</option></select></label></div>
<label>Machine HP<input id="maxHp" type="number" inputmode="decimal" value="15"></label>
<div class="out" id="out"></div><button class="sm" id="fav" style="margin-top:10px;width:100%">★ Save setup as favorite</button><div class="src" id="src"></div></main>
<script type="module" src="app.js"></script></body></html>
